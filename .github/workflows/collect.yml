name: 보험 공시 수집

on:
  schedule:
    - cron: "17 22 * * 0"   # 매주 월요일 07:17 (한국시간) - UTC 기준 일요일 22:17
  workflow_dispatch:         # Actions 화면에서 'Run workflow' 버튼으로 수동 실행
    inputs:
      lines:
        description: "수집할 보험종류 (쉼표로 구분, 예: 암,치아)"
        default: "암,질병,상해"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r collector/requirements.txt
      - name: 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LINES: ${{ github.event.inputs.lines || '암,질병,상해' }}
        run: python collector/collect.py
